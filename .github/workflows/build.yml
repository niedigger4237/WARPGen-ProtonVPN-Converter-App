name: Build Android + Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  # Сборка движка ByeDPI из исходников (Windows .exe и Android-исполняемые файлы).
  # Каждый шаг необязателен: если сборка не удалась, приложение собирается без встроенного ByeDPI.
  byedpi:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p out/win out/android
      - name: Исходники ByeDPI
        continue-on-error: true
        run: git clone --depth 1 https://github.com/hufrea/byedpi src-byedpi
      - name: Windows (mingw)
        continue-on-error: true
        run: |
          sudo apt-get update -y && sudo apt-get install -y gcc-mingw-w64-x86-64
          cd src-byedpi
          make windows CC=x86_64-w64-mingw32-gcc
          cp ciadpi.exe ../out/win/
      - name: Android (NDK)
        continue-on-error: true
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cd src-byedpi
          build() {  # <компилятор> <abi>
            make clean >/dev/null 2>&1 || rm -f *.o ciadpi
            make -j"$(nproc)" CC="$TC/$1" && mkdir -p "../out/android/$2" && cp ciadpi "../out/android/$2/libciadpi.so"
          }
          build aarch64-linux-android30-clang arm64-v8a
          build armv7a-linux-androideabi30-clang armeabi-v7a
          build x86_64-linux-android30-clang x86_64
      - run: find out -type f
      - uses: actions/upload-artifact@v4
        with:
          name: byedpi-bin
          path: out
          if-no-files-found: warn

  windows:
    needs: byedpi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: byedpi-bin
          path: byedpi-dl
      - name: Положить ciadpi.exe в сборку
        shell: pwsh
        run: |
          if (Test-Path byedpi-dl/win/ciadpi.exe) { Copy-Item byedpi-dl/win/ciadpi.exe byedpi-bin/ciadpi.exe; Write-Host "ByeDPI встроен" } else { Write-Host "ByeDPI не собран — сборка без него" }
      - run: npm install
      - run: npm run build:web
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: WarpProtonAWG-windows
          path: |
            dist/*.exe

  android:
    needs: byedpi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: byedpi-bin
          path: byedpi-dl
      - run: npm install
      - run: npm run build:web
      - run: npx cap add android
      - name: Нативный плагин (прокси + ByeDPI) и OkHttp
        run: |
          dir=$(dirname "$(find android/app/src/main/java -name MainActivity.java | head -1)")
          cp android-native/*.java "$dir/"
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "com.squareup.okhttp3:okhttp:4.12.0"/' android/app/build.gradle
          # исполняемый файл ByeDPI должен распаковываться в nativeLibraryDir
          printf '\nandroid {\n    packagingOptions {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n}\n' >> android/app/build.gradle
          if [ -d byedpi-dl/android ]; then
            mkdir -p android/app/src/main/jniLibs
            cp -r byedpi-dl/android/* android/app/src/main/jniLibs/
            echo "ByeDPI встроен:"; find android/app/src/main/jniLibs -type f
          else
            echo "ByeDPI не собран — сборка без него"
          fi
      - name: Манифест (запись в Документы, распаковка библиотек)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <application#' $f
          sed -i '0,/<application/s#<application#<application android:requestLegacyExternalStorage="true" android:extractNativeLibs="true"#' $f
          grep -n "STORAGE\|extractNativeLibs" $f
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WarpProtonAWG-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
