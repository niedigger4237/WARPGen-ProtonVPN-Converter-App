name: Build Android + Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm install
      - run: npm run build:web
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: WarpProtonAWG-windows
          path: |
            dist/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build:web
      - run: npx cap add android
      - name: Разрешение на запись в Документы (Android 9 и ниже)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <application#' $f
          sed -i '0,/<application/s#<application#<application android:requestLegacyExternalStorage="true"#' $f
          grep -n "STORAGE" $f
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WarpProtonAWG-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
