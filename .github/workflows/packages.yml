name: Build packages

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASS:
        required: false
      ALIAS_PASS:
        required: false

permissions:
  contents: read

jobs:
  # Сборка движка ByeDPI из исходников (Windows .exe и Android-исполняемые файлы).
  # Каждый шаг необязателен: если сборка не удалась, приложение собирается без встроенного ByeDPI.
  byedpi:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p out/win out/android
      - name: Исходники ByeDPI
        continue-on-error: true
        run: |
          git init src-byedpi
          git -C src-byedpi fetch --depth 1 https://github.com/hufrea/byedpi e2684772fbda45f2ff4fc220922a010370534216
          git -C src-byedpi checkout --detach FETCH_HEAD
      - name: Windows (mingw)
        continue-on-error: true
        run: |
          sudo apt-get update -y && sudo apt-get install -y gcc-mingw-w64-x86-64
          cd src-byedpi
          make windows CC=x86_64-w64-mingw32-gcc
          cp ciadpi.exe ../out/win/
      - name: Android (NDK)
        continue-on-error: true
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cd src-byedpi
          build() {  # <компилятор> <abi>
            make clean >/dev/null 2>&1 || rm -f *.o ciadpi
            make -j"$(nproc)" CC="$TC/$1" && mkdir -p "../out/android/$2" && cp ciadpi "../out/android/$2/libciadpi.so"
          }
          build aarch64-linux-android23-clang arm64-v8a
          build armv7a-linux-androideabi30-clang armeabi-v7a
          build x86_64-linux-android23-clang x86_64
      - run: find out -type f
      - uses: actions/upload-artifact@v4
        with:
          name: byedpi-bin
          path: out
          if-no-files-found: warn

  windows:
    needs: byedpi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: byedpi-bin
          path: byedpi-dl
      - name: Положить ciadpi.exe в сборку
        shell: pwsh
        run: |
          if (Test-Path byedpi-dl/win/ciadpi.exe) { Copy-Item byedpi-dl/win/ciadpi.exe byedpi-bin/ciadpi.exe; Write-Host "ByeDPI встроен" } else { Write-Host "ByeDPI не собран — сборка без него" }
      - run: npm ci
      - run: python tools/build.py
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: WarpProtonAWG-windows
          path: dist/*.exe
          if-no-files-found: error

  android:
    needs: byedpi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: byedpi-bin
          path: byedpi-dl
      - run: npm ci
      - run: python tools/build.py
      - run: npx cap add android
      - name: Нативный плагин (прокси + ByeDPI) и OkHttp
        run: |
          dir=$(dirname "$(find android/app/src/main/java -name MainActivity.java | head -1)")
          cp android-native/*.java "$dir/"
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "com.squareup.okhttp3:okhttp:4.12.0"/' android/app/build.gradle
          # исполняемый файл ByeDPI должен распаковываться в nativeLibraryDir
          printf '\nandroid {\n    packagingOptions {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n}\n' >> android/app/build.gradle
          if [ -d byedpi-dl/android ]; then
            mkdir -p android/app/src/main/jniLibs
            cp -r byedpi-dl/android/* android/app/src/main/jniLibs/
            echo "ByeDPI встроен:"; find android/app/src/main/jniLibs -type f
          else
            echo "ByeDPI не собран — сборка без него"
          fi
      - name: Манифест (запись в Документы, распаковка библиотек)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n    <application#' $f
          sed -i 's#</application>#    <service android:name="com.local.protonawg.DpiService" android:exported="false" android:foregroundServiceType="specialUse">\n            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="local_socks_proxy" />\n        </service>\n    </application>#' $f
          sed -i '0,/<application/s#<application#<application android:requestLegacyExternalStorage="true" android:extractNativeLibs="true"#' $f
          grep -n "STORAGE\|extractNativeLibs\|DpiService\|FOREGROUND\|POST_NOTIF" $f
      - name: Set Android version from package.json
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('package.json'));
          if (!/^\d+\.\d{1,2}\.\d{1,2}$/.test(version)) throw new Error('Expected major.minor.patch with minor and patch below 100');
          const [major, minor, patch] = version.split('.').map(Number);
          const code = major * 10000 + minor * 100 + patch;
          const file = 'android/app/build.gradle';
          const original = fs.readFileSync(file, 'utf8');
          if (!/^        versionCode 1$/m.test(original) || !/^        versionName "1.0"$/m.test(original)) throw new Error('Unexpected Capacitor version defaults');
          fs.writeFileSync(file, original.replace('versionCode 1', 'versionCode ' + code).replace('versionName "1.0"', 'versionName "' + version + '"'));
          JS
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew :app:${{ inputs.release && 'assembleRelease' || 'assembleDebug' }}
      - name: Sign and verify release APK
        if: inputs.release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64}" "${KEYSTORE_PASS:?Missing KEYSTORE_PASS}" "${ALIAS_PASS:?Missing ALIAS_PASS}"
          umask 077
          keystore=$(mktemp "${RUNNER_TEMP}/signing.XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$signer" sign --ks "$keystore" --ks-key-alias VladConvGen \
            --ks-pass env:KEYSTORE_PASS --key-pass env:ALIAS_PASS \
            --out WarpProtonAWG-release.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$signer" verify --verbose --print-certs WarpProtonAWG-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WarpProtonAWG-android
          path: ${{ inputs.release && 'WarpProtonAWG-release.apk' || 'android/app/build/outputs/apk/debug/app-debug.apk' }}
          if-no-files-found: error
