name: Build packages

on:
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
      legacy_windows:
        type: boolean
        default: false
      release:
        type: boolean
        default: false
      version:
        type: string
        default: ''
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASS:
        required: false
      ALIAS_PASS:
        required: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      semver: ${{ steps.version.outputs.semver }}
      windows_semver: ${{ steps.windows-version.outputs.semver }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        if: ${{ inputs.platform != 'windows' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 tools/version.py --platform android --ci-build-code ${{ inputs.release && '--release' || '' }}
      - id: windows-version
        if: ${{ inputs.platform != 'android' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 tools/version.py --platform windows ${{ inputs.release && '--release' || '' }}

  # Сборка движка ByeDPI из исходников (Windows .exe и Android-исполняемые файлы).
  byedpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out/win out/android
      - name: Исходники ByeDPI
        run: |
          git init src-byedpi
          git -C src-byedpi fetch --depth 1 https://github.com/hufrea/byedpi e2684772fbda45f2ff4fc220922a010370534216
          git -C src-byedpi checkout --detach FETCH_HEAD
      - name: Windows (mingw)
        if: ${{ inputs.platform != 'android' }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y gcc-mingw-w64-x86-64
          cd src-byedpi
          make windows CC=x86_64-w64-mingw32-gcc
          cp ciadpi.exe ../out/win/
      - name: Android (NDK)
        if: ${{ inputs.platform != 'windows' }}
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cd src-byedpi
          build() {  # <компилятор> <abi>
            make clean
            make -j"$(nproc)" CC="$TC/$1" CPPFLAGS="-D_DEFAULT_SOURCE -include $GITHUB_WORKSPACE/tools/byedpi/android_ifaddrs.h"
            install -Dm755 ciadpi "../out/android/$2/libciadpi.so"
          }
          build aarch64-linux-android23-clang arm64-v8a
          build armv7a-linux-androideabi23-clang armeabi-v7a
          build x86_64-linux-android23-clang x86_64
      - run: find out -type f
      - uses: actions/upload-artifact@v4
        with:
          name: byedpi-bin
          path: out
          if-no-files-found: error

  windows:
    if: ${{ inputs.platform != 'android' }}
    needs: [version, byedpi]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with:
          name: byedpi-bin
          path: byedpi-dl
      - name: Положить ciadpi.exe в сборку
        shell: pwsh
        run: |
          Copy-Item byedpi-dl/win/ciadpi.exe byedpi-bin/ciadpi.exe -ErrorAction Stop
      - run: npm ci
      - run: python tools/build.py
      - name: Set Windows package version
        env:
          BUILD_VERSION: ${{ needs.version.outputs.windows_semver }}
        run: npm pkg set "version=$env:BUILD_VERSION"
        shell: pwsh
      - run: npm run dist:win
      - name: Check packaged Windows engine
        shell: pwsh
        run: |
          $engine = Get-Item dist/win-unpacked/resources/byedpi/ciadpi.exe -ErrorAction Stop
          if ($engine.Length -eq 0) { throw "Empty packaged ByeDPI executable" }
          & $engine.FullName --version
      - uses: actions/upload-artifact@v4
        with:
          name: WarpProtonAWG-windows
          path: dist/*.exe
          if-no-files-found: error

  android:
    if: ${{ inputs.platform != 'windows' }}
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    needs: [version, byedpi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/download-artifact@v4
        with:
          name: byedpi-bin
          path: byedpi-dl
      - run: python tools/build.py
      - name: Include Android ByeDPI binaries
        run: |
          cp -r byedpi-dl/android android/app/src/main/jniLibs
      - name: Build APK
        working-directory: android
        run: ./gradlew :app:assembleRelease
      - name: Verify ByeDPI inside APK
        env:
          APK: release/app-release-unsigned.apk
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            path="lib/$abi/libciadpi.so"
            unzip -p "android/app/build/outputs/apk/$APK" "$path" > "$RUNNER_TEMP/byedpi-$abi"
            test -s "$RUNNER_TEMP/byedpi-$abi"
            file "$RUNNER_TEMP/byedpi-$abi"
          done
      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64}" "${KEYSTORE_PASS:?Missing KEYSTORE_PASS}" "${ALIAS_PASS:?Missing ALIAS_PASS}"
          umask 077
          keystore=$(mktemp "${RUNNER_TEMP}/signing.XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$signer" sign --ks "$keystore" --ks-key-alias VladConvGen \
            --ks-pass env:KEYSTORE_PASS --key-pass env:ALIAS_PASS \
            --out WarpProtonAWG-signed.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$signer" verify --verbose --print-certs WarpProtonAWG-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WarpProtonAWG-android
          path: WarpProtonAWG-signed.apk
          if-no-files-found: error
