name: Build packages

on:
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
      legacy_windows:
        type: boolean
        default: false
      release:
        type: boolean
        default: false
      version:
        type: string
        default: ''
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASS:
        required: false
      ALIAS_PASS:
        required: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      semver: ${{ steps.version.outputs.semver }}
      windows_name: ${{ steps.windows-version.outputs.name }}
      windows_semver: ${{ steps.windows-version.outputs.semver }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        if: ${{ inputs.platform != 'windows' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 tools/version.py --platform android --ci-build-code ${{ inputs.release && '--release' || '' }}
      - id: windows-version
        if: ${{ inputs.platform != 'android' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 tools/version.py --platform windows ${{ inputs.release && '--release' || '' }}

  # Windows uses the standalone executable; Android builds JNI via CMake.
  byedpi:
    if: ${{ inputs.platform != 'android' && inputs.legacy_windows && !inputs.release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out/win
      - name: Исходники ByeDPI
        run: |
          git init src-byedpi
          git -C src-byedpi fetch --depth 1 https://github.com/hufrea/byedpi e2684772fbda45f2ff4fc220922a010370534216
          git -C src-byedpi checkout --detach FETCH_HEAD
      - name: Windows (mingw)
        run: |
          sudo apt-get update -y && sudo apt-get install -y gcc-mingw-w64-x86-64
          cd src-byedpi
          make windows CC=x86_64-w64-mingw32-gcc
          cp ciadpi.exe ../out/win/
      - run: find out -type f
      - uses: actions/upload-artifact@v4
        with:
          name: byedpi-bin
          path: out
          if-no-files-found: error

  windows:
    if: ${{ inputs.platform != 'android' && inputs.legacy_windows && !inputs.release }}
    needs: [version, byedpi]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: legacy/electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with:
          name: byedpi-bin
          path: byedpi-dl
      - name: Положить ciadpi.exe в сборку
        shell: pwsh
        run: |
          Copy-Item ../../byedpi-dl/win/ciadpi.exe byedpi-bin/ciadpi.exe -ErrorAction Stop
      - run: npm ci
      - run: python tools/build.py
      - name: Set Windows package version
        env:
          BUILD_VERSION: ${{ needs.version.outputs.windows_semver }}
        run: npm pkg set "version=$env:BUILD_VERSION"
        shell: pwsh
      - run: npm run dist:win
      - name: Check packaged Windows engine
        shell: pwsh
        run: |
          $engine = Get-Item dist/win-unpacked/resources/byedpi/ciadpi.exe -ErrorAction Stop
          if ($engine.Length -eq 0) { throw "Empty packaged ByeDPI executable" }
          & $engine.FullName --version
      - uses: actions/upload-artifact@v4
        with:
          name: WarpProtonAWG-windows
          path: legacy/electron/dist/*.exe
          if-no-files-found: error

  android:
    if: ${{ inputs.platform != 'windows' }}
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
      APK_VERSION: ${{ inputs.release && needs.version.outputs.name || format('{0}-preview', needs.version.outputs.name) }}
    needs: [version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Install native build tools
        run: |
          set -euo pipefail
          sdkmanager --version
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;25.0.8775105' 'cmake;3.22.1'
      - name: Test native lifecycle
        run: bash android/app/src/test/native/run_warp_dpi_lifecycle.sh
      - name: Run unit tests and build APK
        run: python3 tools/gradle_ci.py android
      - name: Verify ByeDPI inside APK
        env:
          APK: release/app-release-unsigned.apk
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            path="lib/$abi/libwarp_dpi.so"
            unzip -p "android/app/build/outputs/apk/$APK" "$path" > "$RUNNER_TEMP/byedpi-$abi"
            test -s "$RUNNER_TEMP/byedpi-$abi"
            file "$RUNNER_TEMP/byedpi-$abi"
          done
      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64}" "${KEYSTORE_PASS:?Missing KEYSTORE_PASS}" "${ALIAS_PASS:?Missing ALIAS_PASS}"
          umask 077
          keystore=$(mktemp "${RUNNER_TEMP}/signing.XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          apk="WPToolkit-$APK_VERSION-android.apk"
          "$signer" sign --ks "$keystore" --ks-key-alias VladConvGen \
            --ks-pass env:KEYSTORE_PASS --key-pass env:ALIAS_PASS \
            --out "$apk" android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$signer" verify --verbose --print-certs "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: WPToolkit-android
          path: WPToolkit-${{ env.APK_VERSION }}-android.apk
          if-no-files-found: error
  
  # Portable Compose Desktop; the old Electron job remains preview-only during migration.
  desktop-preview:
    if: ${{ inputs.platform != 'android' }}
    needs: [version]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Build Windows JNI engine
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S desktop/src/main/cpp/warp_dpi -B desktop/build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DJAVA_HOME="$(cygpath -m "$JAVA_HOME")"
          cmake --build desktop/build/native
      - name: Compile and package portable Compose Desktop
        shell: pwsh
        env:
          DESKTOP_PACKAGE_VERSION: ${{ needs.version.outputs.windows_semver }}
          DESKTOP_VERSION: ${{ inputs.release && needs.version.outputs.windows_name || format('{0}-preview', needs.version.outputs.windows_name) }}
        run: python tools/gradle_ci.py desktop
      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: WPToolkit-windows
          path: desktop/build/portable/*.zip
          if-no-files-found: error
