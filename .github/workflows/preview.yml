name: Preview

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, preview-build, theme]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/packages.yml
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
