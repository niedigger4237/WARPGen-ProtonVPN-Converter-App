name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/packages.yml
    with:
      release: true
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      ALIAS_PASS: ${{ secrets.ALIAS_PASS }}

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: WarpProtonAWG-*
          merge-multiple: true
          path: packages
      - name: Publish tagged packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" packages/*.apk packages/*.exe --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" packages/*.apk packages/*.exe --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
