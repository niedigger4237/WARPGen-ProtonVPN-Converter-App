name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например, v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        env:
          TAG: ${{ inputs.version }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)(\.(0|[1-9][0-9]?))?$ ]]; then
            echo "::error::Use a version like v1.0.0"
            exit 1
          fi

  build:
    needs: validate
    uses: ./.github/workflows/packages.yml
    with:
      release: true
      version: ${{ inputs.version }}
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      ALIAS_PASS: ${{ secrets.ALIAS_PASS }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: WarpProtonAWG-*
          merge-multiple: true
          path: packages
      - name: Create tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          existing=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [[ -n "$existing" ]]; then
            echo "::error::Tag $TAG already exists; choose a new version"
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" packages/*.apk packages/*.exe --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
