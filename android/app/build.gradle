plugins {
    id 'com.android.application' version '8.7.2'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21'
}

def taggedName = providers.environmentVariable('VERSION_NAME')
def taggedCode = providers.environmentVariable('VERSION_CODE')
def localVersion = providers.exec {
    workingDir rootProject.projectDir.parentFile
    commandLine(System.getProperty('os.name').startsWith('Windows') ? 'python' : 'python3', 'tools/version.py', '--json')
}.standardOutput.asText.map { new groovy.json.JsonSlurper().parseText(it) }

android {
    namespace 'com.local.protonawg'
    compileSdk 35
    defaultConfig {
        applicationId 'com.niefigger.convgen'
        minSdk 23
        targetSdk 35
        versionName taggedName.orElse(localVersion.map { it.name }).get()
        versionCode taggedCode.map { it.toInteger() }.orElse(localVersion.map { it.code }).get()
    }
    ndkVersion '25.0.8775105'
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/warp_dpi/CMakeLists.txt')
            version '3.22.1'
        }
    }
    defaultConfig {
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packagingOptions.jniLibs.useLegacyPackaging = true
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
